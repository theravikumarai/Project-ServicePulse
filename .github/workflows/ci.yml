name: ServicePulse CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    name: Python Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: |
          python -m compileall streamlit_app

      - name: Validate application imports
        run: |
          python -c "import streamlit_app.config"
          python -c "import streamlit_app.queries"

      - name: CI completed
        run: echo "ServicePulse CI passed successfully."